- id: eng-c7-q1
  question: "A colleague changed the SitRep prompt, tried it on three reports, and says \"it's clearly better now, let's ship\". What is the most important missing step?"
  options:
    - text: "Try it on three more reports to be sure."
      correct: false
      why: "Six hand-picked tries are still a vibe check. Outputs vary, and a change can fix what you look at while breaking what you don't."
    - text: "Ask the model whether the new prompt is better."
      correct: false
      why: "A model's opinion of a prompt is not a measurement. It has no view of the cases that matter to you."
    - text: "Run the golden dataset with both prompts and compare case by case for improvements and newly failing cases."
      correct: true
      why: "That is the improvement loop: a fixed set of cases, a score, and a case-by-case comparison so that regressions are visible before shipping."
    - text: "Ship it, and roll back if users complain."
      correct: false
      why: "Silent failures, such as one invented figure in a fluent SitRep, rarely produce complaints before harm is done. Measure offline first."

- id: eng-c7-q2
  question: "You are building the first golden dataset for the SitRep Assistant. Which set of 20 cases is most useful?"
  options:
    - text: "A mix of typical reports, edge cases (families vs people, duplicates, ambiguous dates), reports in languages other than English, adversarial reports and out-of-scope requests."
      correct: true
      why: "A golden set should cover the ways the system fails, not just the ways it succeeds. Edge, multilingual and adversarial cases are where regressions hide."
    - text: "20 typical, clean reports, so the score reflects everyday use."
      correct: false
      why: "Clean cases will almost all pass and tell you little. The score looks good right up until an edge case reaches a published SitRep."
    - text: "2,000 synthetic reports generated by a model, with no human review, for statistical power."
      correct: false
      why: "Unreviewed synthetic cases often have wrong expectations and unrealistic inputs. Twenty cases you have read beat thousands you haven't."
    - text: "The same examples used as few-shot examples in the prompt, since we know their correct answers."
      correct: false
      why: "That grades the model on questions it was shown the answers to. Keep test cases separate from prompt examples."

- id: eng-c7-q3
  question: "You need to check that every figure in a SitRep appears in the source reports. What is the best first check?"
  options:
    - text: "An LLM judge asked \"Are the figures accurate? Score 1-10\"."
      correct: false
      why: "Vague, costly, and subject to judge biases. When code can check a property directly, use code."
    - text: "Human review of every SitRep."
      correct: false
      why: "Valuable for calibration and high-stakes cases, but it doesn't scale to every change on every case."
    - text: "Exact match against a reference SitRep."
      correct: false
      why: "There are many valid SitReps. Exact match would fail good outputs that are worded differently."
    - text: "A rule-based check that extracts every number from the output and verifies it appears in the input."
      correct: true
      why: "Deterministic, free and run on every case. It will sometimes flag legitimate computed totals, which you allow explicitly, but it reliably catches invented figures."

- id: eng-c7-q4
  question: "Your LLM judge agrees with human reviewers on 85% of SitReps. Most SitReps (about 85%) pass. What should you conclude?"
  options:
    - text: "The judge is reliable; 85% agreement is high."
      correct: false
      why: "If 85% of outputs pass, a judge that always says \"pass\" would also agree 85% of the time. Raw agreement can hide a useless judge."
    - text: "Look at chance-corrected agreement (such as Cohen's kappa) and especially the false passes before trusting it."
      correct: true
      why: "Kappa corrects for agreement expected by chance, and the false-pass cell shows whether the judge approves bad SitReps, which is the dangerous error."
    - text: "Replace the human reviewers with the judge, since it saves time."
      correct: false
      why: "Calibration is ongoing. People stay in the loop on a sample, and must re-check whenever the judge model or rubric changes."
    - text: "Use the same model as the SitRep writer for the judge, to improve agreement."
      correct: false
      why: "Same-family judges show self-preference bias. A different family usually gives a more independent verdict."

- id: eng-c7-q5
  question: "Two runs of the agent produce the same correct SitRep. Run A used 5 tool calls; run B used 38, including three identical searches and one blocked call to send_sitrep_email. What kind of eval catches the problem with run B?"
  options:
    - text: "An exact-match eval on the final SitRep."
      correct: false
      why: "Both final outputs are identical. Output-only evals are blind to how the agent got there."
    - text: "An LLM judge on the final SitRep's tone."
      correct: false
      why: "Tone is unrelated. The problem is in the path, not the text."
    - text: "A trajectory eval: checks on tool order, forbidden tools, repeated calls and steps used against the budget."
      correct: true
      why: "Trajectory evals check the path. Run B is costly, nearly exhausted its budget, and attempted a forbidden action, all invisible in the final output."
    - text: "A latency dashboard."
      correct: false
      why: "It might show run B was slow, but it won't say why or flag the forbidden attempt. Use a trajectory check for that."

- id: eng-c7-q6
  question: "A prompt change raises the golden-set pass rate from 70% to 80%. But case g12, a report with an embedded \"IGNORE ALL PREVIOUS INSTRUCTIONS\", passed before and now fails. What should happen?"
  options:
    - text: "Treat it as a regression: block or flag the change until someone looks at g12, even though the average improved."
      correct: true
      why: "Compare case by case. A higher average does not excuse newly failing cases, especially an adversarial one."
    - text: "Ship it; the overall pass rate went up by 10 points."
      correct: false
      why: "Averages hide which cases changed. Losing an injection-resistance case to gain formatting cases is a bad trade."
    - text: "Delete g12 from the dataset because it is flaky."
      correct: false
      why: "Removing a failing test to make a change pass is how evals lose their value. If you suspect flakiness, run it several times."
    - text: "Lower the pass threshold so both versions pass."
      correct: false
      why: "Moving the goalposts hides the regression rather than addressing it."

- id: eng-c7-q7
  question: "Which of these should NOT be written to your traces?"
  options:
    - text: "The prompt version and model name for each call."
      correct: false
      why: "Needed to reproduce runs and to attribute a regression to a prompt or model change."
    - text: "Token counts and cost per call."
      correct: false
      why: "Needed for cost dashboards and budget alerts."
    - text: "Tool calls with their arguments and truncated results."
      correct: false
      why: "Needed to explain where a figure came from and for trajectory evals."
    - text: "The provider API key used for the call."
      correct: true
      why: "Secrets never go in logs or traces. Traces are widely read by people debugging, and a leaked key is an incident."

- id: eng-c7-q8
  question: "The population-lookup service is down during a flood response. Every SitRep run waits 30 seconds, times 3 retries, for every population call, then fails. Which pattern fixes this best?"
  options:
    - text: "Increase the timeout to 120 seconds."
      correct: false
      why: "Runs would wait even longer for a service that is not answering. Longer timeouts make an outage worse."
    - text: "A circuit breaker that stops calling the failing service after repeated errors, plus graceful degradation: a SitRep without population context, clearly marked."
      correct: true
      why: "The breaker fails fast instead of waiting, protects the recovering service from a wall of retries, and the degraded SitRep still delivers value, labelled honestly."
    - text: "Raise the retry count to 10."
      correct: false
      why: "More retries against a service that is down add delay and load, not reliability."
    - text: "Let the model estimate populations when the service fails."
      correct: false
      why: "That replaces a visible gap with an invisible invented figure, which is the worst outcome for a SitRep."
