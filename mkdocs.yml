site_name: Practical AI
site_description: AI Literacy and AI Engineering — two free, practical 8-class courses
site_url: https://elias-lee.github.io/practical-ai-courses/
docs_dir: content
site_dir: site
use_directory_urls: false
copyright: Practical AI — an independent learning resource.

theme:
  name: material
  font: false
  logo: assets/img/logo.svg
  favicon: assets/img/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.highlight

plugins:
  - search
  - offline

hooks:
  - hooks/quiz.py
  - hooks/design.py

# Snippet sources are included into pages, never built on their own.
# Instructor pages ship only in the instructor edition (mkdocs.instructor.yml).
exclude_docs: |
  shared/
  instructor/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - def_list
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [content]
      check_paths: true

extra:
  # The offline plugin otherwise loads this shim from unpkg.com, which breaks search
  # without internet. Vendored copy of iframe-worker@1.0.4/shim (MIT, squidfunk).
  polyfills:
    - assets/js/iframe-worker-shim.js
  generator: false

extra_css:
  - assets/css/extra.css
extra_javascript:
  - assets/js/quiz.js

nav:
  - Home: index.md
  - AI Literacy:
      - literacy/index.md
      - "1. What AI Is": literacy/c1.md
      - "2. How Chatbots Work": literacy/c2.md
      - "3. Prompting Well": literacy/c3.md
      - "4. Giving AI the Right Information": literacy/c4.md
      - "5. AI at Work": literacy/c5.md
      - "6. Checking AI": literacy/c6.md
      - "7. Agents & Automation": literacy/c7.md
      - "8. Safe & Responsible AI": literacy/c8.md
  - AI Engineering:
      - engineering/index.md
      - "Pre-work: Setup": engineering/prework.md
      - "1. Foundations": engineering/c1.md
      - "2. Prompting & Structured Outputs": engineering/c2.md
      - "3. Building with Code": engineering/c3.md
      - "4. Context Engineering & RAG": engineering/c4.md
      - "5. Harness & Tools": engineering/c5.md
      - "6. Agents & Orchestration": engineering/c6.md
      - "7. Evals & Observability": engineering/c7.md
      - "8. Security & Production": engineering/c8.md
  - Reference:
      - AI Map: ai-map.md
      - Glossary: glossary.md
      - About: about.md
