<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 438" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img">
<title>Reference architecture of an agentic AI system</title>
<rect width="780" height="438" rx="12" fill="#ffffff"/>
<rect x="20" y="20" width="560" height="58" rx="8" fill="#eef3f8" stroke="#b9c8d8" stroke-width="1"/><text x="36" y="44" font-size="16" font-weight="700" fill="#1d2733">Interface</text><text x="36" y="64" font-size="12.5" fill="#4b5a6a">chat · API · email / Teams · human approval screen</text>
<rect x="20" y="88" width="560" height="58" rx="8" fill="#eef3f8" stroke="#b9c8d8" stroke-width="1"/><text x="36" y="112" font-size="16" font-weight="700" fill="#1d2733">Orchestration layer</text><text x="36" y="132" font-size="12.5" fill="#4b5a6a">planner / router · workflow engine · state &amp; checkpoints · budgets &amp; stop rules</text>
<rect x="20" y="156" width="560" height="58" rx="8" fill="#eef3f8" stroke="#b9c8d8" stroke-width="1"/><text x="36" y="180" font-size="16" font-weight="700" fill="#1d2733">Agents</text><text x="36" y="200" font-size="12.5" fill="#4b5a6a">Intake · Researcher · Analyst · Writer · Reviewer</text>
<rect x="20" y="224" width="560" height="58" rx="8" fill="#eef3f8" stroke="#b9c8d8" stroke-width="1"/><text x="36" y="248" font-size="16" font-weight="700" fill="#1d2733">Harness</text><text x="36" y="268" font-size="12.5" fill="#4b5a6a">system prompts · tools (MCP) · guardrails · structured outputs · permissions</text>
<rect x="20" y="292" width="560" height="58" rx="8" fill="#eef3f8" stroke="#b9c8d8" stroke-width="1"/><text x="36" y="316" font-size="16" font-weight="700" fill="#1d2733">Context &amp; data</text><text x="36" y="336" font-size="12.5" fill="#4b5a6a">RAG pipeline · vector store · memory · multilingual ingestion</text>
<rect x="20" y="360" width="560" height="58" rx="8" fill="#eef3f8" stroke="#b9c8d8" stroke-width="1"/><text x="36" y="384" font-size="16" font-weight="700" fill="#1d2733">Models</text><text x="36" y="404" font-size="12.5" fill="#4b5a6a">model router · large, small and reasoning models</text>
<rect x="596" y="20" width="164" height="398" rx="8" fill="#eef3f8" stroke="#b9c8d8" stroke-width="1"/>
<text x="678.0" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2733">Cross-cutting</text>
<text x="678.0" y="90.0" text-anchor="middle" font-size="14" fill="#1d2733">Evals</text>
<text x="678.0" y="174.5" text-anchor="middle" font-size="14" fill="#1d2733">Observability</text>
<text x="678.0" y="259.0" text-anchor="middle" font-size="14" fill="#1d2733">Security</text>
<text x="678.0" y="343.5" text-anchor="middle" font-size="14" fill="#1d2733">Cost</text>
</svg>
