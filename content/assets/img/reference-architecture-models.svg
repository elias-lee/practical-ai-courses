<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 406" role="img" aria-labelledby="arch-models-t">
<title id="arch-models-t">Reference architecture of an agentic AI system, with Models highlighted</title>
<rect class="dg-box" x="4" y="4" width="530" height="58" rx="7"/>
<text class="dg-label" x="20" y="27" style="font-size:15px">Interface</text>
<text class="dg-note" x="20" y="47" style="font-size:12.5px">chat, API, email, human approval screen</text>
<rect class="dg-box" x="4" y="72" width="530" height="58" rx="7"/>
<text class="dg-label" x="20" y="95" style="font-size:15px">Orchestration layer</text>
<text class="dg-note" x="20" y="115" style="font-size:12.5px">planner and router, workflow engine, state, checkpoints, budgets, stop rules</text>
<rect class="dg-box" x="4" y="140" width="530" height="58" rx="7"/>
<text class="dg-label" x="20" y="163" style="font-size:15px">Agents</text>
<text class="dg-note" x="20" y="183" style="font-size:12.5px">Intake, Researcher, Analyst, Writer, Reviewer</text>
<rect class="dg-box" x="4" y="208" width="530" height="58" rx="7"/>
<text class="dg-label" x="20" y="231" style="font-size:15px">Harness</text>
<text class="dg-note" x="20" y="251" style="font-size:12.5px">system prompts, tools (MCP), guardrails, structured outputs, permissions</text>
<rect class="dg-box" x="4" y="276" width="530" height="58" rx="7"/>
<text class="dg-label" x="20" y="299" style="font-size:15px">Context &amp; data</text>
<text class="dg-note" x="20" y="319" style="font-size:12.5px">RAG pipeline, vector store, memory, multilingual ingestion</text>
<rect class="dg-box dg-box--accent" x="4" y="344" width="530" height="58" rx="7"/>
<text class="dg-accent-text" x="20" y="367" style="font-size:15px">Models</text>
<text class="dg-note" x="20" y="387" style="font-size:12.5px">model router; large, small and reasoning models</text>
<rect class="dg-box dg-box--muted" x="548" y="4" width="148" height="398" rx="7"/>
<text class="dg-label" x="622.0" y="30" text-anchor="middle">Cross-cutting</text>
<text class="dg-note" x="622.0" y="76.0" text-anchor="middle" style="font-size:13px">Evals</text>
<text class="dg-note" x="622.0" y="160.5" text-anchor="middle" style="font-size:13px">Observability</text>
<text class="dg-note" x="622.0" y="245.0" text-anchor="middle" style="font-size:13px">Security</text>
<text class="dg-note" x="622.0" y="329.5" text-anchor="middle" style="font-size:13px">Cost</text>
</svg>
